# Test config — small and fast. 2 generations, 4 prompts, 2 scenarios.
# Uses the Oracle box (verified working); swap to local-ollama if you
# have ollama running locally.
loop: evolver-smoke-test

task:
  name: "smoke test"
  prompt_template: "{prompt}\n\nScenario: {scenario}"

model:
  backend: ssh-ollama
  model: lfm25-1.2b
  num_predict: 60
  ssh:
    host: ubuntu@147.224.38.131
    key: ~/.ssh/oracle-instance.key
    proxy: "nc -X connect -x hatch-egress-proxy:3128 %h %p"
    known_hosts: /home/hatch/workspace/night-learn/oracle-known-hosts

scenarios:
  - "A bridge sensor reports vibration 3x normal during a storm."
  - "The database backup failed twice this week."

seeds:
  - "Decide GO or NO-GO. One line of reasoning."
  - "You are a careful engineer. Verdict GO or NO-GO, then one line of reasoning."
  - "Think about what could go wrong first. Then GO or NO-GO."
  - "Give a GO or NO-GO verdict. Be specific, no hedging."

population: 4
keep: 2
pause_secs: 0
generations: 2

judge:
  command: "~/workspace/skills/typesafe/bin/jev.py"
  question: "Is this a clear GO or NO-GO verdict with sound one-line reasoning?"
  true_label: "clear verdict and sound reasoning"
  false_label: "unclear, missing verdict, or poor reasoning"

mutations:
  - {op: append, text: " Be specific."}
  - {op: append, text: " No hedging."}
  - {op: prepend, text: "You are a careful engineer. "}
  - {op: crossover}

ledger: ./ledger.test.jsonl
